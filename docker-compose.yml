version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123123
      MYSQL_DATABASE: pypad
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./pypad-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123123
      MYSQL_DATABASE: pypad
      LLM_PROVIDER: mock
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./pypad-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
